
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saqib Gaming</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
background: #101020;
color: white;
font-family: Arial, sans-serif;
min-height: 100vh;
}

header {
  background: #202040;
  padding: 25px;
  text-align: center;
}

header h1 {
  color: #00ffcc;
  font-size: 30px;
}

nav {
  background: #303050;
  padding: 15px;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 10px;
}

.hero {
  text-align: center;
  padding: 60px 20px;
}

.hero h2 {
  color: #00ffcc;
  font-size: 28px;
}

.hero p {
  margin: 20px;
  font-size: 16px;
}

button {
  background: #00cc99;
  color: black;
  border: none;
  padding: 14px 25px;
  border-radius: 8px;
  font-size: 16px;
}

.games {
  text-align: center;
  padding: 25px;
}

.game {
  background: #252545;
  padding: 25px;
  margin: 15px;
  border-radius: 12px;
}

footer {
  background: #202040;
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>SAQUIB GAMING</h1>
  <p>Welcome to My Gaming World</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#games">Games</a>
  <a href="#contact">Contact</a>
</nav>

<section class="hero">
  <h2>Welcome Gamers!</h2>
  <p>Play Games, Have Fun and Enjoy!</p>
  <button onclick="alert('Welcome to Saquib Gaming!')">
    Start Gaming
  </button>
</section>

<section class="games" id="games">
  <h2>My Favourite Games</h2>

  <div class="game">
    <h3>Free Fire</h3>
    <p>Battle and Survive!</p>
  </div>

  <div class="game">
    <h3>Minecraft</h3>
    <p>Build Your World!</p>
  </div>

  <div class="game">
    <h3>BGMI</h3>
    <p>Let's Battle!</p>
  </div>
</section>

<footer id="contact">
  <p>© 2026 Saquib Gaming</p>
  <p>Thanks for Visiting!</p>
</footer>

</body>
</html>
