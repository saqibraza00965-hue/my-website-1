<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EXTREME 4X4 WORLD</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#17251b;font-family:Arial;color:white;touch-action:none}
#game{position:fixed;inset:0}
#top{
 position:absolute;top:10px;left:10px;right:10px;
 display:flex;justify-content:space-between;gap:5px;z-index:5
}
button{
 background:#151d24;color:white;border:1px solid #00e5a0;
 border-radius:10px;padding:10px;font-weight:bold
}
#controls{position:absolute;bottom:20px;left:0;right:0;z-index:5}
#steering{
 position:absolute;bottom:10px;left:20px;
 width:115px;height:115px;border-radius:50%;
 background:#ffffff35;border:3px solid white;
 display:grid;place-items:center;font-size:42px
}
#rightControls{position:absolute;right:18px;bottom:8px;display:grid;gap:12px}
.drive{width:75px;height:65px;background:#172a2aee;font-size:13px}
#gas{height:90px;background:#008b55}
#brake{background:#9d2727}
#info{
 position:absolute;top:65px;left:12px;
 background:#101a19cc;padding:10px;border-radius:10px;
 font-size:13px;z-index:4
}
#garagePanel{
 display:none;position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);width:85%;
 max-width:340px;background:#111e20;
 border:2px solid #00e5a0;border-radius:16px;
 padding:20px;z-index:10;text-align:center
}
#garagePanel button{margin:5px}
#editHint{position:absolute;bottom:150px;left:10px;font-size:11px;color:#ddd}
#cameraHint{position:absolute;top:125px;right:10px;font-size:11px}
</style>
</head>
<body>

<div id="game"></div>

<div id="top">
 <button>EXTREME 4X4</button>
 <button onclick="changeMode()">DRIVE: <span id="mode">4X4</span></button>
 <button onclick="editControls()">EDIT HUD</button>
</div>

<div id="info">
 SPEED: <span id="speed">0</span> km/h<br>
 MODE: <span id="modeInfo">4X4</span><br>
 CAMERA: 360°
</div>

<div id="cameraHint">Drag screen to rotate camera</div>

<div id="controls">
 <div id="steering">↔</div>
 <div id="rightControls">
  <button class="drive" id="gas">ACCELERATE ▲</button>
  <button class="drive" id="brake">BRAKE ▼</button>
  <button class="drive" onclick="changeCamera()">CAMERA</button>
  <button class="drive" onclick="openGarage()">GARAGE</button>
 </div>
</div>

<div id="editHint">EDIT HUD दबाकर controls को खिसकाएँ</div>

<div id="garagePanel">
 <h2>🏁 CAR GARAGE</h2>
 <p>अपनी गाड़ी का रंग चुनें</p>
 <button onclick="paint('#080808')">BLACK</button>
 <button onclick="paint('#d82020')">RED</button>
 <button onclick="paint('#eeeeee')">WHITE</button>
 <button onclick="paint('#174caa')">BLUE</button>
 <p>Drive mode: 4X4 / 2X2</p>
 <button onclick="closeGarage()">CLOSE GARAGE</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c8dc);
scene.fog=new THREE.Fog(0x91c8dc,90,320);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x48603a,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(50,100,40);
sun.castShadow=true;
scene.add(sun);

function material(color){
 return new THREE.MeshStandardMaterial({color,roughness:.8});
}

// GREEN LAND
const land=new THREE.Mesh(
 new THREE.PlaneGeometry(1000,1000),
 material(0x477b3e)
);
land.rotation.x=-Math.PI/2;
land.position.y=-.5;
land.receiveShadow=true;
scene.add(land);

// MOUNTAINS
for(let i=0;i<75;i++){
 let h=15+Math.random()*55;
 let hill=new THREE.Mesh(
  new THREE.ConeGeometry(12+Math.random()*25,h,7),
  material(i%2?0x326b3c:0x477d42)
 );
 hill.position.set(
  (Math.random()-.5)*380,
  h/2-1,
  (Math.random()-.5)*380
 );
 hill.castShadow=true;
 scene.add(hill);
}

// ROAD CURVE
const points=[
 new THREE.Vector3(0,.05,0),
 new THREE.Vector3(0,.05,-35),
 new THREE.Vector3(35,.05,-70),
 new THREE.Vector3(65,.05,-110),
 new THREE.Vector3(20,.05,-150),
 new THREE.Vector3(-30,.05,-190),
 new THREE.Vector3(-75,.05,-150),
 new THREE.Vector3(-55,.05,-100),
 new THREE.Vector3(-20,.05,-60)
];
const path=new THREE.CatmullRomCurve3(points,true);
const roadMat=material(0x333b3c);

let vertices=[],indices=[];
const segments=500;
for(let i=0;i<=segments;i++){
 const t=i/segments;
 const p=path.getPointAt(t);
 const tangent=path.getTangentAt(t);
 const side=new THREE.Vector3(-tangent.z,0,tangent.x).normalize();
 vertices.push(
  p.x-side.x*5,p.y,p.z-side.z*5,
  p.x+side.x*5,p.y,p.z+side.z*5
 );
 if(i<segments){
  let n=i*2;
  indices.push(n,n+1,n+2,n+1,n+3,n+2);
 }
}
const roadGeo=new THREE.BufferGeometry();
roadGeo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
roadGeo.setIndex(indices);
roadGeo.computeVertexNormals();
const road=new THREE.Mesh(roadGeo,roadMat);
road.receiveShadow=true;
scene.add(road);

// RIVER
const river=new THREE.Mesh(
 new THREE.PlaneGeometry(70,15),
 new THREE.MeshStandardMaterial({color:0x249ec4,metalness:.2,roughness:.25})
);
river.rotation.x=-Math.PI/2;
river.position.set(12,-.25,-85);
scene.add(river);

// BRIDGES
for(let i=0;i<4;i++){
 const t=.12+i*.22;
 const p=path.getPointAt(t);
 const tan=path.getTangentAt(t);
 const bridge=new THREE.Group();
 bridge.position.set(p.x,p.y+.15,p.z);
 bridge.rotation.y=Math.atan2(-tan.x,-tan.z);

 const deck=new THREE.Mesh(
  new THREE.BoxGeometry(12,.5,9),
  material(0x8b7654)
 );
 bridge.add(deck);

 for(let side of [-1,1]){
  const rail=new THREE.Mesh(
   new THREE.BoxGeometry(12,1,.25),
   material(0xdddddd)
  );
  rail.position.set(0,.7,side*4);
  bridge.add(rail);
 }
 scene.add(bridge);
}

// TREES
for(let i=0;i<180;i++){
 let x=(Math.random()-.5)*300;
 let z=(Math.random()-.5)*300;
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.5,4),
  material(0x68452b)
 );
 trunk.position.set(x,2,z);
 scene.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(2+Math.random()*2,7,7),
  material(0x185d2b)
 );
 leaves.position.set(x,5,z);
 scene.add(leaves);
}

// GARAGES
const garages=[];
for(let i=0;i<4;i++){
 const p=path.getPointAt(.18+i*.2);
 const g=new THREE.Group();
 g.position.set(p.x+13,.1,p.z);

 const building=new THREE.Mesh(
  new THREE.BoxGeometry(9,5,8),
  material(0x59636b)
 );
 building.position.y=2.5;
 g.add(building);

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(7,3,4),
  material(0x923b26)
 );
 roof.position.y=6.5;
 g.add(roof);
 scene.add(g);
 garages.push(g.position.clone());
}

// SUV
const car=new THREE.Group();
const black=material(0x080808);
const glass=new THREE.MeshStandardMaterial({
 color:0x142c38,metalness:.6,roughness:.2
});

const body=new THREE.Mesh(
 new THREE.BoxGeometry(3.2,1.1,5),
 black
);
body.position.y=1.3;
car.add(body);

const cabin=new THREE.Mesh(
 new THREE.BoxGeometry(2.8,1.35,2.5),
 black
);
cabin.position.set(0,2.35,-.35);
car.add(cabin);

const windows=new THREE.Mesh(
 new THREE.BoxGeometry(2.82,1,2.4),glass
);
windows.position.set(0,2.4,-.35);
car.add(windows);

for(let x of [-1.65,1.65]){
 for(let z of [-1.65,1.65]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.65,.65,.4,20),
   material(0x101010)
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.75,z);
  car.add(wheel);
 }
}
car.position.copy(path.getPointAt(0));
scene.add(car);

// CONTROLS
let speed=0,steer=0,mode='4X4';
let cameraAngle=0,camDistance=10;
let gas=false,brake=false,editing=false;

function changeMode(){
 mode=mode==='4X4'?'2X2':'4X4';
 document.getElementById('mode').innerText=mode;
 document.getElementById('modeInfo').innerText=mode;
}
function changeCamera(){
 cameraAngle+=Math.PI/2;
}
